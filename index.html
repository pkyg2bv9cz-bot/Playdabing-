
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayDabing TV</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:white;
 font-family:Arial,sans-serif
}
header{text-align:center;padding:28px;background:#111c31}
h1{margin:0;font-size:30px}
h1 span{color:#38bdf8}
main{max-width:650px;margin:auto;padding:20px}
.card{
 background:#142239;border:1px solid #294363;
 border-radius:16px;padding:20px;margin-bottom:18px
}
textarea{
 width:100%;height:110px;padding:14px;
 border-radius:10px;border:1px solid #456080;
 background:#091426;color:white;font-size:16px
}
button{
 width:100%;padding:15px;margin-top:10px;
 border:0;border-radius:10px;
 background:#168bd2;color:white;
 font-size:16px;font-weight:bold
}
button.stop{background:#a83245}
#result{
 min-height:60px;padding:14px;
 background:#091426;border-radius:10px;
 line-height:1.5
}
.status{color:#38bdf8}
footer{text-align:center;color:#71839d;padding:20px}
</style>
</head>
<body>
<header>
<h1>PLAY<span>DABING</span> TV</h1>
<p>Tvůj svět. Tvůj český dabing.</p>
</header>

<main>
<div class="card">
<h2>🎬 AI český překladač</h2>
<p>Vlož anglickou větu:</p>
<textarea id="english" placeholder="Enter English text..."></textarea>
<button onclick="translateText()">🇨🇿 Přeložit do češtiny</button>
</div>

<div class="card">
<h2>🗣️ Český AI hlas</h2>
<div id="result">Zde se zobrazí český překlad.</div>
<button onclick="speakText()">🔊 Přehrát český hlas</button>
<button class="stop" onclick="stopVoice()">■ Zastavit hlas</button>
<p class="status" id="status">● Připraveno</p>
</div>
</main>

<footer>PlayDabing TV © 2026</footer>

<script>
let translated = "";

async function translateText(){
 const input = document.getElementById("english").value.trim();
 const status = document.getElementById("status");

 if(!input){
   status.textContent="Nejdříve napiš anglickou větu.";
   return;
 }

 status.textContent="Překládám...";

 try{
   const url =
    "https://api.mymemory.translated.net/get?q="
    +encodeURIComponent(input)
    +"&langpair=en|cs";

   const response = await fetch(url);
   const data = await response.json();

   if(data.responseStatus !== 200){
     throw new Error("Překlad se nepodařil.");
   }

   translated = data.responseData.translatedText;

   document.getElementById("result").textContent=translated;
   status.textContent="● Překlad dokončen!";
 }catch(error){
   status.textContent="Chyba překladu. Zkus to znovu.";
 }
}

function speakText(){
 if(!translated){
   document.getElementById("status").textContent=
    "Nejdříve přelož text.";
   return;
 }

 if(!("speechSynthesis" in window)){
   document.getElementById("status").textContent=
    "Toto zařízení nepodporuje hlas.";
   return;
 }

 speechSynthesis.cancel();

 const voice = new SpeechSynthesisUtterance(translated);
 voice.lang="cs-CZ";
 voice.rate=1;
 voice.pitch=1;

 speechSynthesis.speak(voice);
 document.getElementById("status").textContent=
  "● Přehrávám český hlas";
}

function stopVoice(){
 if("speechSynthesis" in window){
   speechSynthesis.cancel();
 }
 document.getElementById("status").textContent="Hlas zastaven.";
}
</script>
</body>
</html>
