
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayDabing TV</title>

<style>
body {
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #55d6ff;
  font-size: 30px;
}

button {
  padding: 15px 20px;
  margin: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

#start, #test {
  background: #19b875;
  color: white;
}

#stop {
  background: #d94343;
  color: white;
}

.panel {
  background: #202635;
  padding: 18px;
  border-radius: 12px;
  margin-top: 18px;
  text-align: left;
  overflow-wrap: anywhere;
}

.status {
  color: #55d6ff;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>PLAYDABING TV</h1>
<p>Automatický anglicko-český dabing</p>

<button id="start" onclick="startListening()">
Spustit mikrofon
</button>

<button id="stop" onclick="stopListening()">
Zastavit
</button>

<button id="test" onclick="testCzechVoice()">
Otestovat český hlas
</button>

<div class="panel">
<h3>Anglický přepis</h3>
<p id="english">Zatím nic neslyším...</p>
</div>

<div class="panel">
<h3>Český překlad</h3>
<p id="czech">Čekám na překlad...</p>
</div>

<p class="status" id="status">Připraveno</p>

<script>
let recognition = null;
let listening = false;
let busy = false;
let voices = [];

const english = document.getElementById("english");
const czech = document.getElementById("czech");
const statusText = document.getElementById("status");

function loadVoices() {
  voices = window.speechSynthesis.getVoices();
}

loadVoices();

if ("onvoiceschanged" in speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getCzechVoice() {
  loadVoices();

  return voices.find(voice =>
    voice.lang.toLowerCase() === "cs-cz"
  ) || voices.find(voice =>
    voice.lang.toLowerCase().startsWith("cs")
  ) || null;
}

function speakCzech(text) {
  return new Promise((resolve, reject) => {
    if (!("speechSynthesis" in window)) {
      reject(new Error("Hlasové přehrávání není podporováno."));
      return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voice = getCzechVoice();

    utterance.lang = "cs-CZ";
    utterance.rate = 0.9;
    utterance.pitch = 1;

    if (voice) {
      utterance.voice = voice;
    }

    utterance.onend = () => resolve();
    utterance.onerror = event => {
      reject(new Error(event.error || "Hlas se nepodařilo přehrát."));
    };

    speechSynthesis.speak(utterance);
  });
}

async function testCzechVoice() {
  try {
    statusText.textContent = "Testuji český hlas...";
    await speakCzech("Ahoj, toto je test českého hlasu PlayDabing TV.");
    statusText.textContent = "Test českého hlasu dokončen.";
  } catch (error) {
    statusText.textContent = "Chyba hlasu: " + error.message;
  }
}

function setupRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.textContent =
      "Rozpoznávání řeči není podporováno.";
    return false;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = async function(event) {
    let text = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript;
      }
    }

    if (!text.trim()) return;

    english.textContent = text;
    busy = true;
    recognition.stop();

    await translateText(text);
  };

  recognition.onerror = function(event) {
    statusText.textContent =
      "Chyba mikrofonu: " + event.error;
    busy = false;
  };

  recognition.onend = function() {
    if (listening && !busy) {
      setTimeout(startRecognition, 700);
    }
  };

  return true;
}

function startRecognition() {
  if (!listening || busy || !recognition) return;

  try {
    recognition.start();
    statusText.textContent = "Poslouchám angličtinu...";
  } catch (error) {
    statusText.textContent = "Spouštím mikrofon...";
  }
}

function startListening() {
  if (listening) return;

  if (!recognition && !setupRecognition()) return;

  listening = true;

  // Aktivace hlasového přehrávání při stisknutí tlačítka.
  speechSynthesis.cancel();

  const unlock = new SpeechSynthesisUtterance("");
  speechSynthesis.speak(unlock);

  startRecognition();
}

function stopListening() {
  listening = false;
  busy = false;

  if (recognition) {
    recognition.stop();
  }

  speechSynthesis.cancel();
  statusText.textContent = "Mikrofon a hlas zastaveny.";
}

async function translateText(text) {
  try {
    statusText.textContent = "Překládám do češtiny...";

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=en|cs";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Překladač neodpovídá.");
    }

    const data = await response.json();

    if (!data.responseData ||
        !data.responseData.translatedText) {
      throw new Error("Překlad není dostupný.");
    }

    const translation =
      data.responseData.translatedText;

    czech.textContent = translation;
    statusText.textContent = "Přehrávám český hlas...";

    await speakCzech(translation);

    if (listening) {
      busy = false;
      startRecognition();
    } else {
      statusText.textContent = "Připraveno.";
    }

  } catch (error) {
    statusText.textContent =
      "Chyba: " + error.message;

    busy = false;

    if (listening) {
      startRecognition();
    }
  }
}
</script>

</body>
</html>
