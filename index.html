
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayDabing TV</title>

<style>
body {
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 { color: #55d6ff; }

button {
  padding: 15px 22px;
  margin: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

#start { background: #19b875; color: white; }
#stop { background: #d94343; color: white; }

.panel {
  background: #202635;
  padding: 18px;
  border-radius: 12px;
  margin-top: 18px;
  text-align: left;
  overflow-wrap: anywhere;
}

.status { color: #55d6ff; }
</style>
</head>

<body>

<h1>PLAYDABING TV</h1>
<p>Automatický anglicko-český dabing</p>

<button id="start" onclick="startListening()">Spustit mikrofon</button>
<button id="stop" onclick="stopListening()">Zastavit</button>

<div class="panel">
  <h3>Anglický přepis</h3>
  <p id="english">Zatím nic neslyším...</p>
</div>

<div class="panel">
  <h3>Český překlad</h3>
  <p id="czech">Čekám na překlad...</p>
</div>

<p class="status" id="status">Připraveno</p>

<script>
let recognition;
let listening = false;
let busy = false;

const english = document.getElementById("english");
const czech = document.getElementById("czech");
const statusText = document.getElementById("status");

function setupRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.textContent =
      "Rozpoznávání řeči není podporováno.";
    return false;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = async function(event) {
    let text = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript;
      }
    }

    if (!text.trim()) return;

    english.textContent = text;
    recognition.stop();
    busy = true;

    await translateText(text);
  };

  recognition.onerror = function(event) {
    statusText.textContent =
      "Chyba mikrofonu: " + event.error;
    busy = false;
  };

  recognition.onend = function() {
    if (listening && !busy) {
      setTimeout(startRecognition, 500);
    }
  };

  return true;
}

function startRecognition() {
  if (!listening || busy) return;

  try {
    recognition.start();
    statusText.textContent = "Poslouchám angličtinu...";
  } catch (error) {
    statusText.textContent = "Spouštím mikrofon...";
  }
}

function startListening() {
  if (listening) return;

  if (!recognition && !setupRecognition()) return;

  listening = true;
  startRecognition();
}

function stopListening() {
  listening = false;
  busy = false;

  if (recognition) recognition.stop();

  speechSynthesis.cancel();
  statusText.textContent = "Mikrofon zastaven.";
}

async function translateText(text) {
  try {
    statusText.textContent = "Překládám do češtiny...";

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=en|cs";

    const response = await fetch(url);
    const data = await response.json();

    const translation = data.responseData.translatedText;

    if (!translation) {
      throw new Error("Překlad není dostupný.");
    }

    czech.textContent = translation;

    statusText.textContent = "Přehrávám český hlas...";

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(translation);

    utterance.lang = "cs-CZ";
    utterance.rate = 1;

    utterance.onend = function() {
      busy = false;

      if (listening) {
        startRecognition();
      } else {
        statusText.textContent = "Připraveno.";
      }
    };

    utterance.onerror = function() {
      busy = false;

      if (listening) {
        startRecognition();
      }
    };

    speechSynthesis.speak(utterance);

  } catch (error) {
    statusText.textContent =
      "Chyba překladu: " + error.message;

    busy = false;

    if (listening) {
      startRecognition();
    }
  }
}
</script>

</body>
</html>
