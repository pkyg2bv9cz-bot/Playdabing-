
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">

<title>PlayDabing TV</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #09090d;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 18px;
}

.app {
    width: 100%;
    max-width: 440px;
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    text-align: center;
    margin-top: 20px;
    margin-bottom: 40px;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.logo-icon {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: linear-gradient(135deg, #438cff, #9b63ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}

.logo h1 {
    font-size: 25px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.8px;
}

.subtitle {
    color: #92909d;
    font-size: 13px;
    margin-top: 10px;
}

.languages {
    display: flex;
    width: 100%;
    gap: 12px;
}

.language-box {
    flex: 1;
    padding: 17px 15px;
    border-radius: 18px;
    min-height: 100px;
}

.english {
    background: linear-gradient(145deg, #15263b, #101722);
    border: 1px solid #243c58;
}

.czech {
    background: linear-gradient(145deg, #282039, #171420);
    border: 1px solid #3c3158;
}

.language-label {
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: 700;
}

.english .language-label {
    color: #70aaff;
}

.czech .language-label {
    color: #b89aff;
}

.language-title {
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
}

.language-description {
    font-size: 11px;
    color: #92909d;
    margin-top: 5px;
}

.microphone-area {
    margin-top: 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.mic-button {
    width: 118px;
    height: 118px;
    border: 1px solid rgba(143, 111, 255, 0.5);
    border-radius: 50%;
    background: linear-gradient(145deg, #202039, #12121d);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s ease;
    box-shadow: 0 0 30px rgba(94, 72, 190, 0.12);
    -webkit-tap-highlight-color: transparent;
}

.mic-inner {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #34305b, #24203b);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}

.mic-button:active {
    transform: scale(0.94);
}

.mic-button.active {
    border-color: #6f8fff;
    box-shadow: 0 0 40px rgba(104, 101, 255, 0.3);
}

.mic-button.active .mic-inner {
    background: linear-gradient(135deg, #386dce, #8751d8);
}

.mic-icon {
    font-size: 36px;
}

.status {
    color: #a5a2af;
    font-size: 13px;
    margin-top: 18px;
}

.status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4acb8a;
    margin-right: 7px;
}

.wave-container {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 24px;
}

.wave {
    width: 3px;
    height: 12px;
    border-radius: 10px;
    background: linear-gradient(to top, #568eff, #a477ff);
    opacity: 0.45;
    transform: scaleY(0.5);
}

.wave-container.active .wave {
    opacity: 1;
    animation: wave 0.7s ease-in-out infinite alternate;
}

.wave:nth-child(2n) {
    animation-delay: 0.12s;
}

.wave:nth-child(3n) {
    animation-delay: 0.24s;
}

.wave:nth-child(4n) {
    animation-delay: 0.36s;
}

@keyframes wave {
    from {
        transform: scaleY(0.4);
    }

    to {
        transform: scaleY(3);
    }
}

.footer {
    margin-top: auto;
    padding-top: 50px;
    padding-bottom: 20px;
    text-align: center;
    color: #797784;
    font-size: 12px;
}

.beta {
    color: #a68cff;
    margin-left: 8px;
}

@media (max-width: 360px) {
    .logo h1 {
        font-size: 22px;
    }

    .language-box {
        padding: 14px 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            <div class="logo-icon">▶</div>
            <h1>PlayDabing TV</h1>
        </div>

        <div class="subtitle">
            Živý překlad a dabing v reálném čase
        </div>
    </header>

    <div class="languages">

        <div class="language-box english">
            <div class="language-label">🇬🇧 ANGLIČTINA</div>
            <div class="language-title">English</div>
            <div class="language-description">Původní jazyk</div>
        </div>

        <div class="language-box czech">
            <div class="language-label">🇨🇿 ČEŠTINA</div>
            <div class="language-title">Čeština</div>
            <div class="language-description">Český dabing</div>
        </div>

    </div>

    <div class="microphone-area">

        <button class="mic-button" id="micButton" aria-label="Spustit mikrofon">
            <div class="mic-inner">
                <span class="mic-icon">🎙️</span>
            </div>
        </button>

        <div class="status" id="status">
            <span class="status-dot"></span>
            Připraveno
        </div>

        <div class="wave-container" id="waves">
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div><div class="wave"></div>
            <div class="wave"></div>
        </div>

    </div>

    <footer class="footer">
        Vytvořil Jan Chaloupka
        <span class="beta">• BETA 0.0.1</span>
    </footer>

</div>

<script>
const micButton = document.getElementById("micButton");
const status = document.getElementById("status");
const waves = document.getElementById("waves");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;
let listening = false;

let translationQueue = [];
let speakingQueue = [];

let translating = false;
let speaking = false;

function setStatus(text) {
    status.innerHTML =
        '<span class="status-dot"></span>' + text;
}

function startListening() {

    if (!SpeechRecognition) {
        setStatus("Rozpoznávání není podporováno");
        return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onstart = () => {
        listening = true;
        micButton.classList.add("active");
        waves.classList.add("active");
        setStatus("Poslouchám angličtinu...");
    };

    recognition.onresult = (event) => {

        for (let i = event.resultIndex; i < event.results.length; i++) {

            if (event.results[i].isFinal) {

                const text =
                    event.results[i][0].transcript.trim();

                if (text !== "") {
                    translationQueue.push(text);
                    processTranslationQueue();
                }
            }
        }
    };

    recognition.onerror = (event) => {

        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {

            listening = false;
            micButton.classList.remove("active");
            waves.classList.remove("active");
            setStatus("Povolte přístup k mikrofonu");

        } else if (event.error !== "no-speech") {

            setStatus("Chyba mikrofonu: " + event.error);
        }
    };

    recognition.onend = () => {

        if (listening) {
            try {
                recognition.start();
            } catch (error) {}
        }
    };

    try {
        recognition.start();
    } catch (error) {
        setStatus("Mikrofon se nepodařilo spustit");
    }
}

function stopListening() {

    listening = false;

    if (recognition) {
        try {
            recognition.stop();
        } catch (error) {}
    }

    micButton.classList.remove("active");
    waves.classList.remove("active");

    setStatus("Pozastaveno");
}

async function translateText(text) {

    try {

        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=en|cs";

        const response = await fetch(url);
        const data = await response.json();

        if (data.responseData &&
            data.responseData.translatedText) {

            return data.responseData.translatedText;
        }

        return "";

    } catch (error) {
        return "";
    }
}

async function processTranslationQueue() {

    if (translating) return;

    translating = true;

    while (translationQueue.length > 0) {

        const text = translationQueue.shift();

        const translated = await translateText(text);

        if (translated) {
            speakingQueue.push(translated);
            processSpeakingQueue();
        }
    }

    translating = false;
}

function processSpeakingQueue() {

    if (speaking) return;
    if (speakingQueue.length === 0) return;

    speaking = true;

    const text = speakingQueue.shift();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "cs-CZ";
    utter.rate = 1;
    utter.pitch = 1;

    utter.onend = () => {
        speaking = false;
        processSpeakingQueue();
    };

    utter.onerror = () => {
        speaking = false;
        processSpeakingQueue();
    };

    window.speechSynthesis.speak(utterance);
}

micButton.addEventListener("click", () => {

    if (listening) {
        stopListening();
    } else {
        startListening();
    }

});
</script>

</body>
</html>
