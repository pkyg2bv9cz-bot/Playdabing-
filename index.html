
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayDabing TV</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #000000;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 12px;
  margin: 0;
}

h1 {
  color: #ffffff;
  font-size: 25px;
  letter-spacing: 2px;
  margin: 10px 0 5px;
}

.subtitle {
  color: #cccccc;
  font-size: 13px;
  margin-bottom: 15px;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
}

button {
  padding: 10px 14px;
  margin: 0;
  border: 1px solid #ffffff;
  border-radius: 7px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  background: #ffffff;
  color: #000000;
}

#stop {
  background: #000000;
  color: #ffffff;
}

.panel-container {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.panel {
  background: #111111;
  border: 1px solid #444444;
  padding: 12px;
  border-radius: 8px;
  min-width: 0;
  min-height: 220px;
  text-align: left;
  overflow-wrap: anywhere;
}

.panel h3 {
  color: #ffffff;
  font-size: 14px;
  text-align: center;
  border-bottom: 1px solid #444444;
  padding-bottom: 9px;
  margin: 0 0 10px;
}

#english, #czech {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #eeeeee;
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
}

.status {
  color: #cccccc;
  margin-top: 14px;
  font-size: 12px;
}

.footer {
  margin-top: 25px;
  padding: 14px 10px;
  border-top: 1px solid #333333;
  color: #888888;
  font-size: 11px;
  letter-spacing: 1px;
}

.footer strong {
  display: block;
  color: #ffffff;
  font-size: 13px;
  margin-bottom: 7px;
}
</style>
</head>

<body>

<h1>PLAYDABING TV</h1>
<p class="subtitle">Překlad angličtiny do češtiny</p>

<div class="controls">
  <button id="start" onclick="startListening()">
    Spustit mikrofon
  </button>

  <button id="stop" onclick="stopListening()">
    Zastavit
  </button>

  <button id="test" onclick="testCzechVoice()">
    Otestovat český hlas
  </button>
</div>

<div class="panel-container">

  <div class="panel">
    <h3>ANGLICKÝ PŘEPIS</h3>
    <p id="english">Zatím nic neslyším...</p>
  </div>

  <div class="panel">
    <h3>ČESKÝ PŘEKLAD</h3>
    <p id="czech">Čekám na překlad...</p>
  </div>

</div>

<p class="status" id="status">Připraveno</p>

<footer class="footer">
  <strong>PLAYDABING TV</strong>
  Vytvořil Jan Chaloupka
  <br><br>
  © 2026 PlayDabing TV
</footer>

<div style="text-align:center; color:#ffffff; font-size:12px; margin-top:20px; padding-bottom:10px; letter-spacing:1px;">
  BETA VERZE 0.1
</div>

<script>
let recognition = null;
let listening = false;
let processing = false;
let restarting = false;
let sentenceQueue = [];
let session = 0;
let voices = [];

const english = document.getElementById("english");
const czech = document.getElementById("czech");
const statusText = document.getElementById("status");

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

loadVoices();

if ("onvoiceschanged" in speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getCzechVoice() {
  loadVoices();

  return voices.find(v =>
    v.lang.toLowerCase() === "cs-cz"
  ) || voices.find(v =>
    v.lang.toLowerCase().startsWith("cs")
  ) || null;
}

function speakCzech(text) {
  return new Promise((resolve, reject) => {
    if (!("speechSynthesis" in window)) {
      reject(new Error("Hlas není podporován."));
      return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    const voice = getCzechVoice();

    utterance.lang = "cs-CZ";
    utterance.rate = 0.95;
    utterance.pitch = 1;

    if (voice) {
      utterance.voice = voice;
    }

    utterance.onend = resolve;

    utterance.onerror = function(event) {
      reject(new Error(event.error || "Přehrávání selhalo."));
    };

    speechSynthesis.speak(utterance);
  });
}

async function testCzechVoice() {
  try {
    statusText.textContent = "Testuji český hlas...";
    await speakCzech(
      "Ahoj, toto je test českého hlasu PlayDabing TV."
    );
    statusText.textContent = "Test českého hlasu dokončen.";
  } catch (error) {
    statusText.textContent = "Chyba hlasu: " + error.message;
  }
}

function setupRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.textContent =
      "Rozpoznávání řeči není podporováno.";
    return false;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = function(event) {
    let finalText = "";
    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      const phrase = result[0].transcript.trim();

      if (result.isFinal && phrase) {
        finalText += phrase + " ";
      } else if (phrase) {
        interimText += phrase + " ";
      }
    }

    if (finalText.trim()) {
      addSentence(finalText.trim());
    }

    if (interimText.trim()) {
      statusText.textContent =
        "Rozpoznávám: " + interimText.trim();
    }
  };

  recognition.onerror = function(event) {
    if (!listening) return;

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      listening = false;
      statusText.textContent = "Mikrofon nemá povolení.";
      return;
    }

    if (event.error !== "no-speech" &&
        event.error !== "aborted") {
      statusText.textContent =
        "Chyba mikrofonu: " + event.error;
    }
  };

  recognition.onend = function() {
    restarting = false;

    if (listening) {
      setTimeout(startRecognition, 500);
    }
  };

  return true;
}

function startRecognition() {
  if (!listening || restarting || !recognition) return;

  try {
    restarting = true;
    recognition.start();
    statusText.textContent = "Poslouchám angličtinu...";
  } catch (error) {
    restarting = false;

    if (listening) {
      setTimeout(startRecognition, 1000);
    }
  }
}

function startListening() {
  if (listening) return;

  if (!recognition && !setupRecognition()) return;

  listening = true;
  session++;
  sentenceQueue = [];

  english.textContent = "";
  czech.textContent = "";

  startRecognition();
}

function stopListening() {
  listening = false;
  session++;
  sentenceQueue = [];

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  speechSynthesis.cancel();

  processing = false;
  restarting = false;

  statusText.textContent = "Mikrofon a hlas zastaveny.";
}

function addSentence(text) {
  english.textContent +=
    (english.textContent ? "\n" : "") + text;

  sentenceQueue.push({
    text: text,
    session: session
  });

  statusText.textContent =
    "Věta zachycena. Čekám na překlad...";

  processQueue();
}

async function translateSentence(text) {
  const url =
    "https://api.mymemory.translated.net/get?q=" +
    encodeURIComponent(text) +
    "&langpair=en|cs";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Překladač neodpovídá.");
  }

  const data = await response.json();

  if (!data.responseData ||
      !data.responseData.translatedText) {
    throw new Error("Překlad není dostupný.");
  }

  return data.responseData.translatedText;
}

async function processQueue() {
  if (processing) return;

  processing = true;

  while (sentenceQueue.length > 0) {
    const item = sentenceQueue.shift();

    if (!listening || item.session !== session) {
      continue;
    }

    try {
      statusText.textContent =
        "Překládám: " + item.text;

      const translation =
        await translateSentence(item.text);

      if (!listening || item.session !== session) {
        continue;
      }

      czech.textContent +=
        (czech.textContent ? "\n" : "") + translation;

      statusText.textContent =
        "Přehrávám český překlad...";

      await speakCzech(translation);

    } catch (error) {
      if (listening && item.session === session) {
        statusText.textContent =
          "Chyba: " + error.message;
      }
    }
  }

  processing = false;

  if (listening) {
    statusText.textContent =
      "Poslouchám další anglické věty...";
  }
}
</script>

</body>
</html>
