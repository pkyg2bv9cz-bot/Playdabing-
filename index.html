
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayDabing TV</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:16px;
 min-height:100vh;
 font-family:Arial,Helvetica,sans-serif;
 color:#fff;
 background:linear-gradient(145deg,#080d1d,#101b36,#17112d);
}

.container{max-width:850px;margin:auto}

header{
 text-align:center;
 padding:24px 10px;
}

.logo{
 font-size:30px;
 font-weight:900;
 letter-spacing:1px;
}

.logo span{color:#8b7bff}

.subtitle{
 color:#9eabc7;
 font-size:13px;
 margin-top:8px;
}

.card{
 background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.09);
 border-radius:18px;
 padding:18px;
 margin-bottom:15px;
 backdrop-filter:blur(10px);
}

.status{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:8px;
 color:#aebbd4;
 font-size:13px;
 margin-bottom:16px;
}

.dot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:#69758e;
}

.dot.active{
 background:#42e59b;
 box-shadow:0 0 10px #42e59b;
}

.buttons{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

button{
 border:0;
 border-radius:12px;
 padding:14px 18px;
 font-weight:bold;
 cursor:pointer;
 color:white;
 flex:1;
 min-width:120px;
}

.start{background:linear-gradient(135deg,#536dff,#8a50ff)}
.stop{background:#29344d}
.test{background:#273e36}

button:disabled{opacity:.4;cursor:not-allowed}

.section-title{
 font-size:16px;
 font-weight:bold;
 margin-bottom:13px;
}

.label{
 font-size:12px;
 color:#aab8d4;
 margin-bottom:8px;
}

.panel{
 background:#0c1428;
 border:1px solid rgba(255,255,255,.07);
 padding:14px;
 border-radius:12px;
 min-height:100px;
 font-size:17px;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.transcript{color:#d8e4f7}
.translation{color:#b8a9ff}

.footer{
 text-align:center;
 color:#65738f;
 font-size:11px;
 padding:18px;
}

.beta{
 text-align:center;
 color:#6d7d9b;
 font-size:11px;
 margin-top:12px;
}

@media(max-width:600px){
 body{padding:12px}
 .logo{font-size:26px}
 .card{padding:14px}
}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">Play<span>Dabing</span> TV</div>
 <div class="subtitle">English → Czech · Ultra Fast Online Engine</div>
</header>

<div class="card">
 <div class="status">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">Připraveno</span>
 </div>

 <div class="buttons">
  <button class="start" id="startBtn" onclick="startListening()">▶ SPUSTIT</button>
  <button class="stop" id="stopBtn" onclick="stopListening()" disabled>■ ZASTAVIT</button>
  <button class="test" onclick="testVoice()">🔊 TEST ZVUKU</button>
 </div>
</div>

<div class="card">
 <div class="section-title">🎧 Anglický originál</div>
 <div class="label">ROZPOZNANÁ ŘEČ</div>
 <div class="panel transcript" id="englishText">
 Zde se zobrazí zachycená angličtina…
 </div>
</div>

<div class="card">
 <div class="section-title">🇨🇿 Český překlad</div>
 <div class="label">ONLINE PŘEKLAD</div>
 <div class="panel translation" id="czechText">
 Zde se zobrazí český překlad…
 </div>
</div>

<div class="footer">
 PlayDabing TV · Ultra Fast Engine
 <div class="beta">BETA 1.0</div>
</div>

</div>

<script>
// ======================================
// PLAYDABING TV - ULTRA FAST ENGINE
// ======================================

const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;
let restartTimer = null;

let translationQueue = [];
let translationWorker = false;

let voiceQueue = [];
let voiceWorker = false;
let voiceGeneration = 0;

let lastSent = "";
let lastSendTime = 0;

const englishBox = document.getElementById("englishText");
const czechBox = document.getElementById("czechText");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

// ======================================
// STATUS
// ======================================

function setStatus(text,active=false){
 statusText.textContent=text;
 statusDot.classList.toggle("active",active);
}

function cleanText(text){
 return text.trim().replace(/\s+/g," ");
}

// ======================================
// SPEECH RECOGNITION
// ======================================

function createRecognition(){
 if(!SpeechRecognition){
  setStatus("Prohlížeč nepodporuje rozpoznávání řeči");
  return null;
 }

 const r = new SpeechRecognition();

 r.lang="en-US";
 r.continuous=true;
 r.interimResults=true;
 r.maxAlternatives=1;

 r.onstart=()=>{
  isListening=true;
  startBtn.disabled=true;
  stopBtn.disabled=false;
  setStatus("Poslouchám angličtinu…",true);
 };

 r.onresult=(event)=>{
  let interim="";
  let finalText="";

  for(let i=event.resultIndex;i<event.results.length;i++){
   const text=event.results[i][0].transcript;

   if(event.results[i].isFinal){
    finalText+=text+" ";
   }else{
    interim+=text;
   }
  }

  if(interim){
   englishBox.textContent=interim;
  }

  if(finalText){
   const cleaned=cleanText(finalText);
   englishBox.textContent=cleaned;
   submitTranslation(cleaned);
  }
 };

 r.onerror=(event)=>{
  if(event.error==="not-allowed" || event.error==="service-not-allowed"){
   isListening=false;
   startBtn.disabled=false;
   stopBtn.disabled=true;
   setStatus("Povolte mikrofon v prohlížeči");
   return;
  }

  if(event.error!=="no-speech" && event.error!=="aborted"){
   console.log("Recognition error:",event.error);
  }
 };

 r.onend=()=>{
  if(isListening){
   clearTimeout(restartTimer);
   restartTimer=setTimeout(()=>{
    try{
     recognition.start();
    }catch(e){}
   },180);
  }else{
   startBtn.disabled=false;
   stopBtn.disabled=true;
  }
 };

 return r;
}

function startListening(){
 if(!SpeechRecognition){
  setStatus("Použijte Chrome s podporou mikrofonu");
  return;
 }

 if(isListening)return;

 isListening=true;

 // Uvolnění audio systému přímo v kliknutí
 if(window.speechSynthesis){
  window.speechSynthesis.resume();
 }

 recognition=createRecognition();

 if(!recognition){
  isListening=false;
  return;
 }

 try{
  recognition.start();
 }catch(e){
  isListening=false;
  setStatus("Mikrofon se nepodařilo spustit");
 }
}

function stopListening(){
 isListening=false;
 clearTimeout(restartTimer);

 if(recognition){
  try{recognition.stop()}catch(e){}
 }

 // Zastavíme aktuální zvuk a vyčistíme čekající dabing
 voiceGeneration++;
 voiceQueue=[];
 voiceWorker=false;

 if(window.speechSynthesis){
  window.speechSynthesis.cancel();
 }

 startBtn.disabled=false;
 stopBtn.disabled=true;
 setStatus("Zastaveno");
}

// ======================================
// TRANSLATION QUEUE
// ======================================

function submitTranslation(text){
 if(!text)return;

 const normalized=text.toLowerCase();

 // Ochrana proti opakovanému zachycení stejné věty
 const now=Date.now();

 if(normalized===lastSent && now-lastSendTime<4000){
  return;
 }

 lastSent=normalized;
 lastSendTime=now;

 translationQueue.push(text);
 processTranslationQueue();
}

async function processTranslationQueue(){
 if(translationWorker)return;

 translationWorker=true;

 try{
  while(translationQueue.length){
   const text=translationQueue.shift();

   setStatus("Překládám online…",isListening);

   try{
    const translated=await translateFast(text);

    if(translated){
     czechBox.textContent=translated;
     enqueueVoice(translated);
    }
   }catch(error){
    console.error(error);
    setStatus("Chyba online překladu",isListening);
   }
  }
 }finally{
  translationWorker=false;

  if(translationQueue.length){
   processTranslationQueue();
  }else if(isListening){
   setStatus("Poslouchám angličtinu…",true);
  }
 }
}

// ======================================
// ULTRA FAST ONLINE TRANSLATOR
// ======================================

async function translateFast(text){
 const url=
  "https://api.mymemory.translated.net/get"+
  "?q="+encodeURIComponent(text)+
  "&langpair=en|cs";

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);

 try{
  const response=await fetch(url,{
   method:"GET",
   signal:controller.signal
  });

  if(!response.ok){
   throw new Error("Translation HTTP "+response.status);
  }

  const data=await response.json();

  const result=
   data?.responseData?.translatedText || "";

  clearTimeout(timeout);

  if(!result.trim()){
   throw new Error("Empty translation");
  }

  return decodeHtml(result.trim());

 }catch(error){
  clearTimeout(timeout);
  throw error;
 }
}

function decodeHtml(text){
 const el=document.createElement("textarea");
 el.innerHTML=text;
 return el.value;
}

// ======================================
// INDEPENDENT CZECH VOICE
// ======================================

function getCzechVoice(){
 const voices=window.speechSynthesis.getVoices();

 return voices.find(v=>v.lang.toLowerCase()==="cs-cz")
 ||voices.find(v=>v.lang.toLowerCase().startsWith("cs"))
 ||null;
}

function enqueueVoice(text){
 if(!text)return;

 voiceQueue.push(text);
 processVoiceQueue();
}

function speakPromise(text,generation){
 return new Promise(resolve=>{
  if(!window.speechSynthesis){
   resolve();
   return;
  }

  if(generation!==voiceGeneration){
   resolve();
   return;
  }

  const utterance=new SpeechSynthesisUtterance(text);
  const voice=getCzechVoice();

  if(voice)utterance.voice=voice;

  utterance.lang="cs-CZ";
  utter.rate=1.12;
  utter.pitch=1;
  utter.volume=1;

  let finished=false;

  const finish=()=>{
   if(finished)return;
   finished=true;
   clearTimeout(watchdog);
   resolve();
  };

  utterance.onend=finish;
  utter.onerror=finish;

  // Ochrana před zamrznutím hlasového enginu
  const watchdog=setTimeout(()=>{
   try{window.speechSynthesis.cancel()}catch(e){}
   finish();
  },25000);

  try{
   window.speechSynthesis.resume();
   window.speechSynthesis.speak(utterance);
  }catch(e){
   finish();
  }
 });
}

async function processVoiceQueue(){
 if(voiceWorker)return;

 voiceWorker=true;
 const generation=voiceGeneration;

 try{
  while(voiceQueue.length && generation===voiceGeneration){
   const text=voiceQueue.shift();
   await speakPromise(text,generation);
  }
 }finally{
  voiceWorker=false;

  if(voiceQueue.length && generation===voiceGeneration){
   processVoiceQueue();
  }
 }
}

// ======================================
// TEST VOICE
// ======================================

function testVoice(){
 if(!window.speechSynthesis){
  setStatus("Český hlas není podporován");
  return;
 }

 voiceGeneration++;
 voiceQueue=[];
 window.speechSynthesis.cancel();

 const test=new SpeechSynthesisUtterance(
  "Ahoj, toto je test českého hlasu PlayDabing TV."
 );

 const voice=getCzechVoice();

 if(voice)test.voice=voice;

 test.lang="cs-CZ";
 test.rate=1.12;
 test.onend=()=>{
  if(isListening)setStatus("Poslouchám angličtinu…",true);
  else setStatus("Test hlasu dokončen");
 };

 test.onerror=()=>{
  setStatus("Chyba českého hlasu");
 };

 window.speechSynthesis.resume();
 window.speechSynthesis.speak(test);
}

// ======================================
// VOICE INITIALIZATION
// ======================================

if(window.speechSynthesis){
 window.speechSynthesis.onvoiceschanged=()=>{
  window.speechSynthesis.getVoices();
 };
}

// ======================================
// PAGE EXIT
// ======================================

window.addEventListener("pagehide",()=>{
 isListening=false;
 clearTimeout(restartTimer);

 if(recognition){
  try{recognition.stop()}catch(e){}
 }

 if(window.speechSynthesis){
  window.speechSynthesis.cancel();
 }
});
</script>

</body>
</html>
